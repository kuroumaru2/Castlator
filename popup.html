<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 265px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
    }
    .row {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
    }
    label {
      color: #e2e8f0;
    }
    select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      max-width: 135px;
    }
    input[type="color"] {
      width: 38px;
      height: 24px;
      padding: 0;
      border: 1px solid #334155;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
    }
    input[type="checkbox"] {
      cursor: pointer;
      width: 15px;
      height: 15px;
    }
    .footer {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #94a3b8;
    }
    button {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    button:hover {
      background: #334155;
    }
  </style>
</head>
<body>
  <h3>Castlator Settings</h3>

  <div class="row">
    <label for="enableToggle">Enable Translation</label>
    <input type="checkbox" id="enableToggle" checked />
  </div>

  <div class="row">
    <label for="romajiHoverToggle">Romaji Popup on Hover</label>
    <input type="checkbox" id="romajiHoverToggle" checked />
  </div>

  <div class="row">
    <label for="langSelect">Translate To</label>
    <select id="langSelect">
      <option value="en">English</option>
      <option value="id">Indonesian</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="zh-CN">Chinese (Simplified)</option>
      <option value="zh-TW">Chinese (Traditional)</option>
      <option value="es">Spanish</option>
      <option value="pt">Portuguese</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="th">Thai</option>
      <option value="vi">Vietnamese</option>
    </select>
  </div>

  <div class="row">
    <label for="fontColorInput">Font Color</label>
    <input type="color" id="fontColorInput" value="#3b82f6" />
  </div>

  <div class="row">
    <label for="fontSizeSelect">Font Size</label>
    <select id="fontSizeSelect">
      <option value="0.8em">Small (0.80x)</option>
      <option value="0.92em" selected>Normal (0.92x)</option>
      <option value="1em">Medium (1.00x)</option>
      <option value="1.15em">Large (1.15x)</option>
      <option value="1.3em">Extra Large (1.30x)</option>
    </select>
  </div>

  <div class="row">
    <label for="fontStyleSelect">Font Style</label>
    <select id="fontStyleSelect">
      <option value="normal" selected>Normal</option>
      <option value="italic">Italic</option>
      <option value="oblique">Oblique</option>
    </select>
  </div>

  <div class="footer">
    <button type="button" id="resetBtn">Reset Style</button>
    <span id="statusText"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
